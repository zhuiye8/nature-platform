spring:
  application:
    name: nature-platform-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/nature_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    time-zone: Asia/Shanghai
  flyway:
    enabled: true
    baseline-on-migrate: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

server:
  port: ${SERVER_PORT:18080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

flowable:
  database-schema-update: true
  async-executor-activate: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt-secret: ${JWT_SECRET:replace-with-at-least-32-bytes-secret-in-production-please}
    token-expire-minutes: ${TOKEN_EXPIRE_MINUTES:120}
  dingtalk:
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}
    corp-id: ${DINGTALK_CORP_ID:}
    redirect-uri: ${DINGTALK_REDIRECT_URI:http://localhost:18080/api/v1/auth/dingtalk/callback}
  minio:
    enabled: ${MINIO_ENABLED:false}
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:nature-files}
  permission:
    sync-on-startup: ${PERMISSION_SYNC_ON_STARTUP:true}
    sync-overwrite-text: ${PERMISSION_SYNC_OVERWRITE_TEXT:false}
