version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nature-postgres
    restart: unless-stopped
    ports:
      - "5442:5432"
    environment:
      POSTGRES_DB: nature
      POSTGRES_USER: nature
      POSTGRES_PASSWORD: nature123
    volumes:
      - nature_pgdata:/var/lib/postgresql/data
      - ../schema.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nature -d nature"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: nature-redis
    restart: unless-stopped
    ports:
      - "6389:6379"
    command: redis-server --appendonly yes
    volumes:
      - nature_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: nature-minio
    restart: unless-stopped
    ports:
      - "9010:9000"
      - "9011:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    command: server /data --console-address ":9001"
    volumes:
      - nature_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: nature-gotenberg
    restart: unless-stopped
    ports:
      - "3011:3000"

volumes:
  nature_pgdata:
  nature_redis:
  nature_minio:
