version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nature-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_DB: nature
      POSTGRES_USER: nature
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nature_prod_2026}
    volumes:
      - nature_pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nature -d nature"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: nature-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-nature_redis_prod_2026}
    volumes:
      - nature_redis_prod:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-nature_redis_prod_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-05-04T21-44-30Z
    container_name: nature-minio
    restart: unless-stopped
    ports:
      - "19000:9000"
      - "19001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-nature_minio_prod}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-nature_minio_prod_2026}
    command: server /data --console-address ":9001"
    volumes:
      - nature_minio_prod:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nature_pgdata_prod:
  nature_redis_prod:
  nature_minio_prod:
