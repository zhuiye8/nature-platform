services:
  mysql:
    image: mysql:8.4
    container_name: nature-platform-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-nature_platform}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:8.4
    container_name: nature-platform-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: nature-platform-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: Asia/Shanghai
    ports:
      - "${MINIO_API_HOST_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ../../nature-platform-api
    container_name: nature-platform-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 18080
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-nature_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: nature-files
      JWT_SECRET: ${JWT_SECRET:-replace-with-at-least-32-bytes-secret-in-production-please}
      DINGTALK_APP_KEY: ${DINGTALK_APP_KEY:-}
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
      DINGTALK_CORP_ID: ${DINGTALK_CORP_ID:-}
      DINGTALK_REDIRECT_URI: ${DINGTALK_REDIRECT_URI:-http://localhost/api/v1/auth/dingtalk/callback}
    depends_on:
      - mysql
      - redis
      - minio
    ports:
      - "${API_HOST_PORT:-18080}:18080"

  web:
    build:
      context: ../../nature-platform-web
    container_name: nature-platform-web
    restart: unless-stopped
    depends_on:
      - api

  gateway:
    image: nginx:1.27-alpine
    container_name: nature-platform-gateway
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "${WEB_HOST_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  mysql_data:
  redis_data:
  minio_data:
